<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futbola CF · FSVL Season 2</title>
  <link rel="icon" href="../images/futbola-favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <style>
    html { scroll-behavior:smooth; }
    body { background:#f7f7f8; color:#111827; }
    .brand-bg {
      background-image:
        linear-gradient(110deg, rgba(255,255,255,.97), rgba(255,247,237,.94)),
        url('../images/backgroundOrangeGradient.jpg');
      background-size:cover;
      background-position:center;
    }
    .hero-bg {
      background:
        radial-gradient(circle at 15% 25%, rgba(236,72,153,.30), transparent 27%),
        radial-gradient(circle at 85% 20%, rgba(124,58,237,.34), transparent 28%),
        linear-gradient(125deg,#111827 0%,#18181b 62%,#3b1307 100%);
    }
    .panel {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:1rem;
      box-shadow:0 10px 30px rgba(17,24,39,.055);
    }
    .section-kicker {
      color:#ea580c;
      font-size:.72rem;
      letter-spacing:.14em;
      font-weight:800;
    }
    .orange-line {
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg,#8b5cf6,#f97316,#ec4899);
    }
    .player-card {
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .player-card:hover {
      transform:translateY(-2px);
      border-color:#fdba74;
      box-shadow:0 10px 24px rgba(17,24,39,.08);
    }
    .player-photo {
      width:100%;
      aspect-ratio:4 / 5;
      object-fit:cover;
      object-position:center top;
      background:#f3f4f6;
    }
    .team-logo-main {
      width:110px;
      height:110px;
      object-fit:contain;
      background:#fff;
      border-radius:9999px;
    }
    img[src*="FUT.png"] { transform:scale(1.18); }
    .position-anchor { scroll-margin-top:5rem; }
    @media (max-width:640px) {
      .team-logo-main { width:88px; height:88px; }
    }
  </style>
</head>

<body class="font-sans">
  <nav class="brand-bg border-b border-orange-100">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center">
        <img src="../images/futbolaLogoOnly.png" width="42" height="42" alt="futbola logo" class="mr-2">
        <span class="text-xl font-bold">futbola</span>
      </a>
      <div class="flex items-center gap-3 text-sm font-semibold">
        <a href="../tournament.html" class="hover:text-orange-600">Tournament</a>
        <a href="../book-game.html" class="hover:text-orange-600">Book Game</a>
      </div>
    </div>
  </nav>

  <header class="hero-bg text-white">
    <div class="max-w-7xl mx-auto px-4 py-10 md:py-12">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-7">
        <div class="flex items-center gap-5">
          <div class="w-28 h-28 md:w-32 md:h-32 flex items-center justify-center flex-shrink-0">
            <img id="teamLogo" src="" alt="" class="team-logo-main">
          </div>
          <div>
            <div class="uppercase tracking-widest text-sm font-bold text-orange-300">FSVL Season 2 · 2026</div>
            <h1 id="teamName" class="text-4xl md:text-5xl font-black mt-1"></h1>
            <div id="teamSubtitle" class="text-gray-300 mt-2"></div>
          </div>
        </div>

        <div class="flex flex-wrap gap-3">
          <a href="../tournament.html"
             class="px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-20 font-black text-sm hover:bg-opacity-20">
            ← Tournament
          </a>
          <a id="manageTeamLink" href="#"
             class="px-4 py-3 rounded-xl bg-white text-gray-900 font-black text-sm hover:bg-orange-50">
            Manage Team
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 md:py-10">
    <section class="mb-8">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <div class="section-kicker">FIRST TEAM</div>
          <h2 class="text-3xl md:text-4xl font-black mt-1">Squad</h2>
          <p id="squadDescription" class="text-sm text-gray-500 mt-2"></p>
        </div>
        <div id="squadSummary" class="text-sm font-bold text-gray-500">Loading squad...</div>
      </div>
      <div class="orange-line mt-5"></div>
    </section>

<div class="flex flex-wrap items-center gap-3 mb-6">

  <button
    id="viewSquadBtn"
    onclick="showTeamView('squad')"
    class="px-4 py-2 rounded-full bg-gray-900 text-white font-bold text-sm">
    Season Squad
  </button>

  <select
    id="matchweekSelect"
    class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">
    <option value="">Select Matchweek</option>
  </select>

</div>

    <nav class="mb-8 overflow-x-auto">
      <div class="flex gap-2 whitespace-nowrap">
        <a href="#GK" class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">Goalkeepers</a>
        <a href="#DF" class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">Defenders</a>
        <a href="#MF" class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">Midfielders</a>
        <a href="#FW" class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">Forwards</a>
        <a href="#OTH" class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">Others</a>
        <a href="#teamStaffSection"
   class="px-4 py-2 rounded-full bg-white border border-gray-200 font-bold text-sm hover:border-orange-300">
  Staff
</a>
      </div>
    </nav>

    <div id="squadSections" class="space-y-10">
      <div class="panel p-6 text-gray-500 font-semibold">Loading Futbola CF players...</div>
    </div>

    <section id="teamStaffSection" class="position-anchor mt-12 hidden">
      <div class="section-kicker">TEAM STAFF</div>
      <h2 class="text-3xl font-black mt-1">Team Staff</h2>
      <div class="orange-line mt-5 mb-5"></div>
      <div id="teamStaffGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <div id="matchweekSection" class="hidden"></div>
  </main>

  <footer class="brand-bg border-t border-orange-100 mt-12">
    <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center">
        <img src="../images/futbolaLogoOnly.png" width="40" height="40" alt="futbola logo" class="mr-2">
        <div>
          <div id="footerTeamName" class="font-black"></div>
          <div class="text-sm text-gray-500">FSVL Season 2 · 2026</div>
        </div>
      </div>
      <a href="../tournament.html" class="text-sm font-bold hover:text-orange-600">← Back to tournament</a>
    </div>
  </footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/+esm';

const supabase = createClient(
  'https://kdbqroxhypnadolcxxxc.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkYnFyb3hoeXBuYWRvbGN4eHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDE3MjkwNzYsImV4cCI6MjA1NzMwNTA3Nn0.c7_RVxoFdJNqQ62R3t1emH2Wf4dSsQaunHsHmbQxOBA'
);

const COMPETITION = 'futbola-svl';
const SEASON = 2;
const params = new URLSearchParams(window.location.search);
const TEAM = params.get('team') || 'FUT';
const teams = {
  FUT: { name:'Futbola CF', logo:'../images/FUT.png' },
  HHC: { name:'Happy Hour SC', logo:'../images/HHC.jpeg' },
  GOB: { name:'Tepen GOB', logo:'../images/GOB.jpeg' },
  FCA: { name:'FC Alpha Vet', logo:'../images/FCA.jpeg' },
  CFC: { name:'Cybersouth FC', logo:'../images/CFC.png' },
  KLC: { name:'KL Classico FC', logo:'../images/KLC.jpeg' }
};

const team = teams[TEAM] || {
  name: TEAM,
  logo: ''
};
let teamMatches = [];

const groups = [
  { code:'GK', title:'Goalkeepers' },
  { code:'DF', title:'Defenders' },
  { code:'MF', title:'Midfielders' },
  { code:'FW', title:'Forwards' },
  { code:'OTH', title:'Others' }
];

function playerPhoto(player) {
  if (player.photo_url) {
    return `
      <div class="relative overflow-hidden bg-gray-100">
        <img
          src="${player.photo_url}"
          alt="${player.jersey_name}"
          class="player-photo"
        >
      </div>
    `;
  }

  const base =
    `./images/player-headshots/FSV-S2/${player.team_code}/${player.id}`;

  return `
    <div class="relative overflow-hidden bg-gray-100">
      <img
        src="${base}.jpeg"
        alt="${player.jersey_name}"
        class="player-photo"
        onerror="
          if (!this.dataset.triedJpg) {
            this.dataset.triedJpg = '1';
            this.src = '${base}.jpg';
          } else {
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          }
        "
      >

      <div
        style="display:none; aspect-ratio:4/5;"
        class="w-full items-center justify-center bg-gray-100 text-gray-300 text-6xl">
        👤
      </div>
    </div>
  `;
}

function playerCard(player) {
  return `
    <article class="player-card bg-white border border-gray-200 rounded-2xl overflow-hidden">
      ${playerPhoto(player)}
      <div class="p-4">
        <div class="flex items-start justify-between gap-2">
          <div class="text-xl font-black leading-tight">${player.jersey_name}</div>
          ${
            player.is_captain
              ? `<span class="px-2 py-1 rounded-full bg-gray-900 text-white text-xs font-black">C</span>`
              : player.is_vice_captain
                ? `<span class="px-2 py-1 rounded-full bg-gray-200 text-gray-700 text-xs font-black">VC</span>`
                : ''
          }
        </div>
<div class="mt-1 text-sm text-gray-500">
  ${player.season_age != null ? `Age ${player.season_age}` : 'Age —'}
  · ${player.position_group || 'OTH'}
</div>
      </div>
    </article>
  `;
}

function renderSquad(players) {
  const html = groups.map(group => {
    const members = players
      .filter(p => (p.position_group || 'OTH') === group.code)
      .sort((a,b) => a.jersey_name.localeCompare(b.jersey_name));

    if (!members.length && group.code === 'OTH') return '';

    return `
      <section id="${group.code}" class="position-anchor">
        <div class="flex items-end justify-between gap-4 mb-4">
          <div>
            <div class="section-kicker">${group.code}</div>
            <h3 class="text-2xl md:text-3xl font-black mt-1">${group.title}</h3>
          </div>
          <div class="text-sm font-bold text-gray-400">
            ${members.length} ${members.length === 1 ? 'player' : 'players'}
          </div>
        </div>

        ${
          members.length
            ? `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-5">
                 ${members.map(playerCard).join('')}
               </div>`
            : `<div class="panel p-5 text-sm text-gray-500">No players assigned to this group yet.</div>`
        }
      </section>
    `;
  }).join('');

  document.getElementById('squadSections').innerHTML = html;

  const counts = Object.fromEntries(
    groups.map(g => [
      g.code,
      players.filter(p => (p.position_group || 'OTH') === g.code).length
    ])
  );

  document.getElementById('squadSummary').textContent =
    `${players.length} players · ${counts.GK} GK · ${counts.DF} DF · ${counts.MF} MF · ${counts.FW} FW`;
}


function staffCard(person, role) {
  return `
    <div class="panel p-5 flex items-center gap-4">
      <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">
        👤
      </div>

      <div class="min-w-0">
        <div class="text-xs uppercase tracking-wider text-orange-600 font-black">
          ${role}
        </div>
        <div class="text-xl font-black mt-1">
          ${person.jersey_name || person.full_name}
        </div>
      </div>
    </div>
  `;
}

function renderTeamStaff(people) {
  const cards = [];

  people.forEach(person => {
    if (person.is_manager) cards.push(staffCard(person, 'Manager'));
    if (person.is_coach) cards.push(staffCard(person, 'Coach'));
    if (person.is_staff) cards.push(staffCard(person, 'Supporting Staff'));
  });

  const section = document.getElementById('teamStaffSection');
  const grid = document.getElementById('teamStaffGrid');

  if (!cards.length) {
    section.classList.add('hidden');
    grid.innerHTML = '';
    return;
  }

  grid.innerHTML = cards.join('');
  section.classList.remove('hidden');
}

async function loadSquad() {
  const { data, error } = await supabase
    .from('season_players')
    .select('id, full_name, jersey_name, season_age, team_code, position_group, active, is_player, is_manager, is_coach, is_staff, is_captain, is_vice_captain')
    .eq('competition_slug', COMPETITION)
    .eq('season', SEASON)
    .eq('team_code', TEAM)
    .eq('active', true)
    .order('jersey_name');

  if (error) throw error;

  const people = data || [];
  const players = people.filter(p => p.is_player !== false);

  renderSquad(players);
  renderTeamStaff(people);
}

async function loadTeamMatches() {
  const { data, error } = await supabase
    .from('league_matches')
    .select('*')
    .eq('competition_slug', COMPETITION)
    .eq('season', SEASON)
    .or(`home_team_code.eq.${TEAM},away_team_code.eq.${TEAM}`)
    .order('matchweek');

  if (error) throw error;

  teamMatches = data || [];
}

function setupMatchweekSelect() {
  const select = document.getElementById('matchweekSelect');

  select.innerHTML = `
    <option value="">Select Matchweek</option>
  `;

  teamMatches.forEach(match => {
    const opponent =
      match.home_team_code === TEAM
        ? match.away_team_code
        : match.home_team_code;

    const option = document.createElement('option');

    option.value = match.id;
    option.textContent = `MW${match.matchweek} · ${opponent}`;

    select.appendChild(option);
  });

  select.addEventListener('change', e => {
    if (!e.target.value) {
      showTeamView('squad');
      return;
    }

    showMatchweekLineup(e.target.value);
  });
}

async function showMatchweekLineup(matchId) {
  const match = teamMatches.find(m => m.id === matchId);

  if (!match) return;

  const { data, error } = await supabase
    .from('match_players')
    .select(`
      player_id,
      sort_order
    `)
    .eq('match_id', matchId)
    .eq('team_code', TEAM)
    .order('sort_order');

  if (error) {
    console.error(error);
    return;
  }

  const playerIds = (data || [])
    .map(row => row.player_id)
    .filter(Boolean);

  let players = [];

  if (playerIds.length) {
    const { data: playerData, error: playerError } = await supabase
      .from('season_players')
      .select('id, full_name, jersey_name, season_age, team_code, position_group')
      .in('id', playerIds);

    if (playerError) {
      console.error(playerError);
      return;
    }

    players = playerData || [];
  }

  renderMatchweekPlayers(match, players);
}

function renderMatchweekPlayers(match, players) {
  const positionOrder = {
    GK: 1,
    DF: 2,
    MF: 3,
    FW: 4,
    OTH: 5
  };

  players.sort((a, b) => {
    const pa = positionOrder[a.position_group || 'OTH'] || 99;
    const pb = positionOrder[b.position_group || 'OTH'] || 99;

    if (pa !== pb) return pa - pb;

    return a.jersey_name.localeCompare(b.jersey_name);
  });

  const opponent =
    match.home_team_code === TEAM
      ? match.away_team_code
      : match.home_team_code;

  document.getElementById('squadSections').classList.add('hidden');
  document.getElementById('teamStaffSection').classList.add('hidden');

  const section = document.getElementById('matchweekSection');
  section.classList.remove('hidden');

  section.innerHTML = `
    <div class="mb-6">
      <div class="section-kicker">
        MATCHWEEK ${match.matchweek}
      </div>

      <h2 class="text-3xl font-black mt-1">
        ${TEAM} vs ${opponent}
      </h2>

      <div class="text-sm text-gray-500 mt-1">
        ${players.length} selected players
      </div>
    </div>

    ${
      players.length
        ? `
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-5">
            ${players.map(playerCard).join('')}
          </div>
        `
        : `
          <div class="panel p-6 text-gray-500">
            Matchweek squad not registered yet.
          </div>
        `
    }
  `;
}

function showTeamView(view) {
  if (view === 'squad') {
    document
      .getElementById('squadSections')
      .classList.remove('hidden');

    document
      .getElementById('matchweekSection')
      .classList.add('hidden');

    if (document.getElementById('teamStaffGrid').children.length) {
      document.getElementById('teamStaffSection').classList.remove('hidden');
    }

    document.getElementById('matchweekSelect').value = '';
  }
}

function renderTeamHeader() {
  document.title = `${team.name} · FSVL Season 2`;

  document.getElementById('manageTeamLink').href =
    `./team-manage.html?team=${encodeURIComponent(TEAM)}`;

  const logo = document.getElementById('teamLogo');
  logo.src = team.logo;
  logo.alt = team.name;

  document.getElementById('teamName').textContent = team.name;

  document.getElementById('teamSubtitle').textContent =
    `${TEAM} · Semi Veteran League`;

  document.getElementById('squadDescription').textContent =
    `${team.name} registered players for FSVL Season 2`;

  document.getElementById('footerTeamName').textContent =
    team.name;
}

window.showTeamView = showTeamView;

async function init() {
  try {
    renderTeamHeader();

    await loadSquad();
    await loadTeamMatches();
    setupMatchweekSelect();

  } catch (err) {
    console.error(err);

    document.getElementById('squadSummary').textContent =
      'Unable to load squad';

    document.getElementById('squadSections').innerHTML = `
      <div class="panel p-6 text-red-600 font-bold">
        Could not load team squad from Supabase.
      </div>
    `;
  }
}

init();


init();
</script>
</body>
</html>
